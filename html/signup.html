<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/search.css">
    <script>var cryptoList = <% - list %></script>
</head>

<body>
    <header>
        <a id="logo" href="/" type="submit">
            <img src="/images/logo.png" alt="logo">
        </a>
        <form onsubmit="return searchValidation('searchInput', cryptoList)"
            style="flex-grow: 1; display: flex; justify-content: right; padding-right: 1em; padding-left: 1em;">
            <div id="search" style="max-width: 25em; width: 100%; border-radius: 5px;">
                <img src="/images/SearchIcon.png" alt="searchIcon">
                <input id="searchInput" autocomplete="off" type="text" placeholder="Search"
                    onkeyup="search(this, cryptoList, '5px')">
                <div id="results"></div>
            </div>
        </form>
        <input type="button" id="account" value="Log in" onclick="window.location.pathname = '/login'"></input>
    </header>
    <div id="headerDivider"></div>
    <section>
        <form action="/signup" id="signupForm" class="accountForm" method="post">
            <p id="title">Signup Form</p>
            <div class="fields">
                <div class="field">
                    <label for="username">&nbsp; Username</label>
                    <div>
                        <img src="/images/userIcon.png" alt="">
                        <input type="text" id="username" autocomplete="off" name="username"
                            placeholder="Enter your username">
                    </div>
                </div>
                <div class="field">
                    <label for="password">&nbsp; Password</label>
                    <div>
                        <img src="/images/lock.png" alt="">
                        <input type="password" id="password" autocomplete="off" name="password"
                            placeholder="Enter your password">
                    </div>
                </div>
            </div>
            <p id="formResult" style="margin: auto auto 2%; color: #dd2121; font-weight: 700;">&nbsp;</p>
            <input type="submit" value="Sign up" id="loginSubmit">
        </form>
    </section>
    <script src="/javascript/sessionManagement.js"></script>
    <script src="/javascript/search.js"></script>
    <script src="/javascript/signup.js"></script>
</body>

</html>
