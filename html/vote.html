<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanah | Vote</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/coin.css">
    <link rel="stylesheet" href="/css/vote.css">
    <link rel="stylesheet" href="/css/search.css">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.14.0/dist/ethers.umd.min.js"></script>
    <script>var cryptoList = <%- list %></script>
    <script>
        var contractAddress = <%- JSON.stringify(contractAddress) %>;
        var contractAbi = <%- contractAbi %>;
        var publicRpcUrl = <%- JSON.stringify(publicRpcUrl) %>;
        var expectedChainId = <%= chainId %>;
    </script>
</head>

<body>
    <header>
        <a id="logo" href="/" type="submit">
            <img src="/images/logo.png" alt="logo">
        </a>
        <form onsubmit="return searchValidation('searchInput', cryptoList)"
            style="flex-grow: 1; display: flex; justify-content: right; padding-right: 1em; padding-left: 1em;">
            <div id="search" style="max-width: 25em; width: 100%; border-radius: 5px;">
                <img src="/images/SearchIcon.png" alt="searchIcon">
                <input id="searchInput" autocomplete="off" type="text" placeholder="Search"
                    onkeyup="search(this, cryptoList, '5px')">
                <div id="results"></div>
            </div>
        </form>
        <%- accountMenu %>
    </header>
    <div id="headerDivider">
        Vote: <%= coin %>
    </div>
    <section>
        <div id="container">

            <div id="status_container">
                <p style="margin-top: 2.55%;">
                    <a>Cast Your Vote</a>
                </p>
                <p id="scholarNotice" style="display: none;">You must be logged in with a <strong>scholar</strong> account to vote. <a href="/login" style="color: inherit;">Log in</a> or create a scholar account.</p>
                <div id="scholarVoteControls" style="display: none;">
                    <button id="connectWalletBtn" onclick="connectWallet()">Connect Wallet</button>
                    <p id="walletStatus">Not connected</p>
                    <select id="proposalId" onchange="fetchTally(this.value)">
                        <option value="">Loading...</option>
                    </select>
                    <p style="text-align: center;">Select a proposal above to see its live tally on the right.</p>
                    <div id="voteButtons">
                        <button onclick="castVote(1)">Halal</button>
                        <button onclick="castVote(2)">Not Halal</button>
                        <button onclick="castVote(3)">Abstain</button>
                    </div>
                    <p id="voteResult"></p>
                </div>
            </div>

            <div id="uses_container" style="grid-row: 2 /span 2;">
                <p>Create New Proposal</p>
                <div id="uses">
                    <input id="coinSymbol" value="<%= coin %>" readonly>
                    <div id="scholarProposalControls">
                        <input id="proposalDescription" placeholder="Description">
                        <input id="proposalDuration" placeholder="Duration (seconds)" type="number">
                        <button onclick="createProposal()">Create Proposal</button>
                        <p id="proposalResult"></p>
                    </div>
                </div>
            </div>

            <div id="summary" style="box-sizing: border-box; overflow: scroll; scrollbar-width: none;">
                <p style="font-size: 36px;">Tally</p>
                <p id="tallyResult">No proposal checked yet.</p>
            </div>

        </div>
    </section>
</body>
<script src="/javascript/sessionManagement.js"></script>
<script src="/javascript/search.js"></script>
<script src="/javascript/vote.js"></script>

</html>
