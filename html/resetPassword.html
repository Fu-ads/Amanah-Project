<form action="/resetPassword" id="resetForm" class="accountForm" method="post"></form>
    <p id="title">Reset Password Form</p>
    <div class="fields">
        <div class="field">
            <label for="username">&nbsp; Username or Email</label>
            <div>
                <img src="/images/userIcon.png" alt="">
                <input type="text" id="resetUsername" autocomplete="off" name="username"
                    placeholder="Enter your username or Email">
            </div>
        </div>
    </div>
    <p id="formResult" style="margin: auto auto 4%; color: #dd2121; font-weight: 700;">&nbsp;</p>
    <input type="submit" value="Reset Password" id="resetSubmit">
</form>
